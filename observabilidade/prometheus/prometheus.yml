global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    sistema: specradar

rule_files:
  - /etc/prometheus/alertas.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # API endurecida (seguranca.app_segura): HTTP, eventos de segurança, fila do pipeline e
  # qualidade do ML. /metrics exige o mesmo METRICS_TOKEN do secret da API.
  - job_name: specradar-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ["api:8000"]
        labels:
          componente: api

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
