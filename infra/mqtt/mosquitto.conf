# Broker MQTT do SpecRadar — configuração-base de segurança para IoT.
#
# ESTADO: preparado, NÃO em produção. A solução atual não tem dispositivo IoT; esta
# configuração é a fundação para a telemetria prevista no roadmap (totens de consulta nas
# concessionárias e, adiante, dados de veículo conectado). Ver docs/SPRINT3 §2.4.
#
# Princípios:
#   * nenhuma porta em texto claro: só 8883 (MQTT sobre TLS 1.2+);
#   * mTLS: todo dispositivo apresenta certificado assinado pela CA do SpecRadar;
#   * a identidade do dispositivo é o CN do certificado (sem senha compartilhada);
#   * ACL por tópico: cada dispositivo só publica na própria árvore.

per_listener_settings true

listener 8883 0.0.0.0
protocol mqtt

cafile   /mosquitto/certs/ca.crt
certfile /mosquitto/certs/servidor.crt
keyfile  /mosquitto/certs/servidor.key
tls_version tlsv1.2
ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
ciphers_tls1.3 TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256

require_certificate true
use_identity_as_username true
allow_anonymous false
acl_file /mosquitto/config/acl

# Limites contra abuso (OWASP API4 aplicado ao broker)
max_connections 500
max_packet_size 65536
max_inflight_messages 20
max_queued_messages 1000

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type subscribe
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S
