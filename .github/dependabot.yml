# SCA contínuo: o Dependabot abre PR quando sai versão nova ou correção de segurança.
# Cada PR passa pelo pipeline DevSecOps inteiro antes do merge.
version: 2
updates:
  - package-ecosystem: uv
    directory: /fordChallenge
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      python-menores:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /fordChallenge/web
    schedule:
      interval: weekly
      day: monday
    groups:
      web-menores:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /fordChallenge/qa
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /infra
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
