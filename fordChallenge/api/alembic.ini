; Alembic do SpecRadar.
;
; Rode sempre da raiz do repositorio:  uv run alembic -c api/alembic.ini upgrade head
; (ou `python scripts/task.py migrate`, que faz exatamente isso).
;
; A URL do banco NAO fica aqui: env.py le DATABASE_URL de os.environ (regra inviolavel,
; segredo so em .env). `sqlalchemy.url` vazio e proposital.
[alembic]
script_location = api/alembic
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
