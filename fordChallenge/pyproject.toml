[project]
name = "specradar"
version = "0.1.0"
description = "SpecRadar - pipeline auditavel de inteligencia competitiva automotiva (FIAP Challenge Ford)"
readme = "README.md"
# Python 3.12 era a decisao do CLAUDE.md; esta maquina tem 3.11.9 (DECISOES_NOITE.md D-02).
requires-python = ">=3.11"
dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt>=2.9",
    # WP-05: `EmailStr` do Pydantic. A alternativa era validar e-mail com regex
    # propria, e regex de e-mail e um classico de falso negativo em dominio valido.
    "email-validator>=2.2",
    "argon2-cffi>=23.1",
    "slowapi>=0.1.9",
    "structlog>=24.4",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0",
    # cliente HTTP e coleta leve
    "httpx>=0.27",
    # ontologia e schema
    "rapidfuzz>=3.10",
    "jsonschema>=4.23",
    "pyyaml>=6.0",
    # parse de PDF sem binario externo (D-09)
    "pypdf>=5.1",
    # extracao estruturada
    "instructor>=1.6",
    # Provedor de LLM: um SDK so para Anthropic, OpenAI, Gemini, DeepSeek e Kimi
    # (`pipeline/llm.py`). O `anthropic` fica porque o litellm o usa como SDK do
    # provedor Anthropic e porque `LLM_PROVIDER=anthropic` e o default historico.
    #
    # ATENCAO ao instalar: o extra `collect` (crawl4ai) fixa `unclecode-litellm==1.81.13`,
    # um fork que publica o MESMO modulo de topo `litellm`. Os dois na mesma venv
    # sobrescrevem os arquivos um do outro. Nesta maquina so o fork esta instalado, e ele
    # atende (`completion`, `completion_cost`, `get_supported_openai_params`); por isso o
    # `import litellm` de `pipeline/llm.py` e preguicoso e tolerante. Ambiente novo:
    # instale este `litellm` OU o extra `collect`, nao os dois de uma vez (D-litellm).
    "litellm>=1.77",
    "anthropic>=0.40",
    # dados
    "pandas>=2.2",
    "beautifulsoup4>=4.12",
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
# Instalados sob demanda: crawl4ai/docling sao pesados e o proprio WP-00 manda
# "nao instalar modelos aqui". Cada WP instala o extra de que precisa (D-12).
collect = ["crawl4ai>=0.4"]          # WP-08 (Playwright)
pdf = ["pdfplumber>=0.11"]          # WP-09 - leve, preserva layout de tabela
pdf-ocr = [
    "pdfplumber>=0.11",
    "pypdfium2>=5.13,<6",
    "rapidocr==3.9.2",
    "onnxruntime==1.30.0",
]  # OCR CPU local; modelos/configuração explícitos, sem serviço pago
docling = ["docling==2.130.0"]       # opções e parser verificados nesta versão
postgres = ["psycopg[binary]>=3.2"]  # producao / CI
# WP-28: dois motores. O weasyprint e o previsto pela spec e depende de bibliotecas
# nativas (GTK/Pango/Cairo); o xhtml2pdf e a reserva em Python puro, para a maquina que
# nao tem o GTK. Ordem de uso declarada em `pipeline/report/render.py` (D-121).
pdfgen = ["weasyprint>=63", "xhtml2pdf>=0.2.16"]
ml = ["scikit-learn>=1.5", "matplotlib>=3.9"]  # docs/07
# FASE 3: XLSX e Parquet da exportacao. Ficam fora da instalacao base de proposito — o
# caminho critico da apresentacao nao pode depender deles, e o CSV, o DDL e o PDF saem
# sem nenhum dos dois. Faltando, `pipeline/export` levanta `FormatoIndisponivel` com o
# nome do extra, em vez de gerar um arquivo de zero byte que so se descobre quebrado na
# frente de outra pessoa.
export = ["openpyxl>=3.1", "pyarrow>=17"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
specradar = "pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "pipeline"]

[tool.uv]
package = true

[tool.ruff]
target-version = "py311"
line-length = 100
# gabarito/build_gabarito.py e mantido por humano (docs/09) e e essencialmente dado
# em forma de codigo, com linhas longas de citacao verbatim: nao passa pelo ruff (D-13).
extend-exclude = [
    "_kits",
    "api/alembic/versions",
    "web",
    "mobile",
    "data",
    "reports",
    "gabarito/build_gabarito.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "C4", "SIM", "RUF"]
ignore = [
    "S101",   # assert: os testes sao o oraculo do projeto
    "RUF001", # caracteres unicode ambiguos em texto pt-BR
    "RUF002",
    "RUF003",
    "B008",   # Depends() no default e o idioma do FastAPI
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"scripts/**" = ["S603", "S607", "T201"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
# tmp_path dentro do projeto: o temp do usuario nesta maquina nega escrita ao processo
# de teste (PermissionError WinError 5). Ver DECISOES_NOITE.md D-20.
# -m "not live": um `pytest` sem argumento NUNCA sai para a rede. O teste marcado
# `live` e explicito e roda com `-m live`, fora do CI.
# --import-mode=importlib: sem ele, dois arquivos de teste com o MESMO nome de arquivo em
# pastas diferentes colidem ("import file mismatch"), porque o modo antigo usa o basename
# como nome de modulo. Aconteceu com `tests/pipeline/test_parity.py` e
# `tests/api/test_parity.py` — os dois nomes que a spec da WP-32 exige no comando de
# verify. A alternativa seria espalhar `__init__.py` pelos diretorios de teste ou renomear
# um dos arquivos contra a spec; trocar o modo de import resolve na raiz.
addopts = ["--basetemp=.tmp/pytest", "-m", "not live", "--import-mode=importlib"]
markers = [
    "slow: testes que passam de alguns segundos (excluidos de verify-quick)",
    "live: exige rede (fora do CI; so nas WP-07/08 quando explicitamente pedido)",
]
filterwarnings = ["ignore::DeprecationWarning"]
